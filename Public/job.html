<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Details</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class=logo href="/">Sarkari Job Portal</a></div></header><main class=wrap><div class=adbox>Advertisement</div><div id=j class=detail></div></main><script>let id=new URLSearchParams(location.search).get("id");fetch("/api/jobs/"+id).then(r=>r.json()).then(x=>{j.innerHTML=`<span class=pill>${x.type}</span><h1>${x.title}</h1><p><b>विभाग:</b> ${x.department}</p><p><b>Vacancy:</b> ${x.vacancy}</p><p><b>Last Date:</b> ${x.lastDate}</p><a class=btn target=_blank href="${x.notificationUrl}">Official Notification ↗</a>`})</script></body></html>
