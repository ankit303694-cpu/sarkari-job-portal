<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class=logo href="/">Sarkari Job Portal</a><span>Admin</span></div></header><main class=wrap><section class=panel><h1>Admin Dashboard</h1><input id=k type=password placeholder="ADMIN_KEY"><button onclick=go()>Login</button></section><div id=d hidden><div id=s class=stats></div><h2>Pending Verification</h2><div id=p class=grid></div><p class=muted>Monetization settings: edit data/monetization.json on the server.</p></div></main><script>let K="";const H=()=>({"x-admin-key":K});async function go(){K=k.value;let r=await fetch("/api/admin/stats",{headers:H()});if(!r.ok)return alert("Wrong key");d.hidden=false;load()}async function load(){let [s,j]=await Promise.all([fetch("/api/admin/stats",{headers:H()}).then(r=>r.json()),fetch("/api/admin/jobs",{headers:H()}).then(r=>r.json())]);document.getElementById("s").innerHTML=Object.entries(s).map(x=>`<div><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");p.innerHTML=j.filter(x=>x.status==="pending_verification").map(x=>`<article class=card><h3>${x.title}</h3><button onclick=ver("${x.id}")>Verify & Publish</button></article>`).join("")||"<div class=empty>Pending queue खाली है।</div>"}async function ver(i){await fetch("/api/jobs/"+i+"/verify",{method:"POST",headers:H()});load()}</script></body></html>
