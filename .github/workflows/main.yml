name: Automatic Government Job Update

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Government Job Update
        env:
          NODE_OPTIONS: --no-warnings
        run: |
          node <<'EOF'
          const fs = require("fs");
          const crypto = require("crypto");

          const sources = [
            {
              name: "SSC",
              url: "https://ssc.gov.in/"
            },
            {
              name: "UPSC",
              url: "https://www.upsc.gov.in/recruitment/recruitment-advertisement"
            },
            {
              name: "Railway",
              url: "https://www.rrbapply.gov.in/"
            },
            {
              name: "Employment News",
              url: "https://employmentnews.gov.in/newemp/AllJobs.aspx?k=All"
            }
          ];

          const file = "Data/jobs.json";

          let jobs = [];

          try {
            jobs = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!Array.isArray(jobs)) jobs = [];
          } catch {
            jobs = [];
          }

          function cleanText(text) {
            return text
              .replace(/\s+/g, " ")
              .replace(/&nbsp;/gi, " ")
              .trim();
          }

          function classify(text) {
            const t = text.toLowerCase();

            if (
              t.includes("admit card") ||
              t.includes("admit-card") ||
              t.includes("hall ticket")
            ) {
              return "admit_card";
            }

            if (
              t.includes("answer key") ||
              t.includes("answer-key")
            ) {
              return "answer_key";
            }

            if (
              t.includes("result") ||
              t.includes("final result") ||
              t.includes("written result")
            ) {
              return "result";
            }

            return "latest";
          }

          function useful(text, href) {
            const t = (text + " " + href).toLowerCase();

            const keywords = [
              "recruit",
              "vacancy",
              "notification",
              "advertisement",
              "advt",
              "exam",
              "application",
              "apply",
              "admit",
              "answer",
              "result",
              "selection",
              "post",
              "job",
              "career",
              "vacancies"
            ];

            return keywords.some(k => t.includes(k));
          }

          function makeId(url) {
            return crypto
              .createHash("sha1")
              .update(url)
              .digest("hex")
              .substring(0, 16);
          }

          function absoluteUrl(base, href) {
            try {
              return new URL(href, base).href;
            } catch {
              return null;
            }
          }

          async function fetchSource(source) {
            console.log("Checking:", source.name);

            try {
              const response = await fetch(source.url, {
                headers: {
                  "User-Agent":
                    "Mozilla/5.0 GovernmentJobPortal/1.0"
                }
              });

              if (!response.ok) {
                console.log(
                  source.name,
                  "HTTP",
                  response.status
                );
                return [];
              }

              const html = await response.text();

              const found = [];

              const regex =
                /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

              let match;

              while ((match = regex.exec(html)) !== null) {
                const href = absoluteUrl(
                  source.url,
                  match[1]
                );

                if (!href) continue;

                const text = cleanText(
                  match[2]
                    .replace(/<[^>]*>/g, " ")
                );

                if (!text) continue;

                if (text.length < 5) continue;

                if (!useful(text, href)) continue;

                found.push({
                  title: text.substring(0, 180),
                  url: href
                });
              }

              return found;
            } catch (error) {
              console.log(
                "ERROR:",
                source.name,
                error.message
              );

              return [];
            }
          }

          async function main() {
            let added = 0;

            for (const source of sources) {
              const items = await fetchSource(source);

              console.log(
                source.name,
                "items:",
                items.length
              );

              for (const item of items) {
                const id = "auto-" + makeId(item.url);

                const exists = jobs.some(
                  j =>
                    j.id === id ||
                    j.notificationUrl === item.url ||
                    j.sourceUrl === item.url
                );

                if (exists) continue;

                const type = classify(item.title);

                jobs.push({
                  id,
                  title: item.title,
                  department: source.name,
                  type,
                  vacancy: "See official notification",
                  lastDate: "See official notification",
                  notificationUrl: item.url,
                  sourceUrl: item.url,
                  sourceName: source.name,
                  status: "pending_verification",
                  verified: false,
                  fetchedAt: new Date().toISOString()
                });

                added++;

                console.log(
                  "Added:",
                  source.name,
                  item.title
                );
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(jobs, null, 2) + "\n"
            );

            console.log(
              "--------------------------------"
            );

            console.log(
              "Total jobs:",
              jobs.length
            );

            console.log(
              "New jobs:",
              added
            );

            console.log(
              "--------------------------------"
            );
          }

          main();
          EOF

      - name: Save updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/jobs.json

          if git diff --cached --quiet; then
            echo "No new government jobs found."
            exit 0
          fi

          git commit -m "Automatic government job update"
          git push
