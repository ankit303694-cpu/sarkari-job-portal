name: Automatic Government Job Update

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Government Job Update
        run: |
          node <<'EOF'
          const fs = require("fs");
          const crypto = require("crypto");

          const sources = [
            {
              name: "SSC",
              url: "https://ssc.gov.in/"
            },
            {
              name: "UPSC",
              url: "https://www.upsc.gov.in/recruitment/recruitment-advertisement"
            },
            {
              name: "Railway",
              url: "https://www.rrbapply.gov.in/"
            },
            {
              name: "Employment News",
              url: "https://employmentnews.gov.in/newemp/AllJobs.aspx?k=All"
            }
          ];

          const file = "Data/jobs.json";

          let jobs = [];

          try {
            jobs = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!Array.isArray(jobs)) jobs = [];
          } catch {
            jobs = [];
          }

          function cleanText(text) {
            return text
              .replace(/<[^>]*>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function classify(text) {
            const t = text.toLowerCase();

            if (
              t.includes("admit card") ||
              t.includes("admit-card") ||
              t.includes("hall ticket")
            ) return "admit_card";

            if (
              t.includes("answer key") ||
              t.includes("answer-key")
            ) return "answer_key";

            if (
              t.includes("result") ||
              t.includes("final result") ||
              t.includes("written result")
            ) return "result";

            return "latest";
          }

          function isUseful(title, href) {
            const t = (title + " " + href).toLowerCase();

            const badWords = [
              "skip to main",
              "skip to content",
              "home",
              "login",
              "logout",
              "register",
              "contact us",
              "privacy policy",
              "terms",
              "accessibility",
              "sitemap",
              "menu",
              "search"
            ];

            if (badWords.some(x => t === x || t.includes(x))) {
              return false;
            }

            const goodWords = [
              "recruit",
              "recruitment",
              "vacancy",
              "vacancies",
              "notification",
              "advertisement",
              "advt",
              "exam",
              "application",
              "apply",
              "admit card",
              "admit-card",
              "answer key",
              "answer-key",
              "result",
              "selection",
              "job",
              "post",
              "posts",
              "career",
              "engagement",
              "appointment"
            ];

            return goodWords.some(x => t.includes(x));
          }

          function makeId(url) {
            return crypto
              .createHash("sha1")
              .update(url)
              .digest("hex")
              .substring(0, 16);
          }

          function absoluteUrl(base, href) {
            try {
              return new URL(href, base).href;
            } catch {
              return null;
            }
          }

          async function fetchSource(source) {
            console.log("Checking:", source.name);

            try {
              const response = await fetch(source.url, {
                headers: {
                  "User-Agent":
                    "Mozilla/5.0 GovernmentJobPortal/1.0"
                }
              });

              if (!response.ok) {
                console.log(
                  source.name,
                  "HTTP",
                  response.status
                );
                return [];
              }

              const html = await response.text();
              const found = [];

              const regex =
                /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

              let match;

              while ((match = regex.exec(html)) !== null) {
                const href = absoluteUrl(
                  source.url,
                  match[1]
                );

                if (!href) continue;

                const title = cleanText(match[2]);

                if (!title) continue;
                if (title.length < 8) continue;
                if (title.length > 180) continue;

                if (!isUseful(title, href)) continue;

                found.push({
                  title,
                  url: href
                });
              }

              return found;

            } catch (error) {
              console.log(
                "ERROR:",
                source.name,
                error.message
              );

              return [];
            }
          }

          async function main() {

            /*
             * पुराने automatic generic junk entries हटाएँ।
             * Published/manual jobs को नहीं छेड़ेंगे।
             */
            jobs = jobs.filter(j => {
              if (!j.id || !j.id.startsWith("auto-")) {
                return true;
              }

              const title = String(j.title || "").toLowerCase();

              const bad = [
                "skip to main",
                "skip to content",
                "home",
                "login",
                "logout",
                "register",
                "contact us",
                "privacy policy",
                "terms",
                "accessibility",
                "sitemap",
                "menu",
                "search"
              ];

              return !bad.some(x => title.includes(x));
            });

            let added = 0;

            for (const source of sources) {

              const items = await fetchSource(source);

              console.log(
                source.name,
                "items:",
                items.length
              );

              for (const item of items) {

                const id = "auto-" + makeId(item.url);

                const exists = jobs.some(j =>
                  j.id === id ||
                  j.notificationUrl === item.url ||
                  j.sourceUrl === item.url
                );

                if (exists) continue;

                const type = classify(item.title);

                jobs.push({
                  id,
                  title: item.title,
                  department: source.name,
                  type,
                  vacancy: "See official notification",
                  lastDate: "See official notification",
                  notificationUrl: item.url,
                  sourceUrl: item.url,
                  sourceName: source.name,
                  status: "pending_verification",
                  verified: false,
                  fetchedAt: new Date().toISOString()
                });

                added++;

                console.log(
                  "Added:",
                  source.name,
                  item.title
                );
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(jobs, null, 2) + "\n"
            );

            console.log("--------------------------------");
            console.log("Total jobs:", jobs.length);
            console.log("New jobs:", added);
            console.log("--------------------------------");
          }

          main();
          EOF

      - name: Save updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Improve automatic government job filtering"
          git push
