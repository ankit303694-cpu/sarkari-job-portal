name: Automatic Government Job Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Government Job Update
        run: |
          node <<'EOF'
          const fs = require("fs");
          const crypto = require("crypto");

          const sources = [
            {
              name: "SSC",
              urls: [
                "https://ssc.gov.in/"
              ]
            },
            {
              name: "UPSC",
              urls: [
                "https://www.upsc.gov.in/recruitment/recruitment-advertisement"
              ]
            },
            {
              name: "Railway",
              urls: [
                "https://www.rrbcdg.gov.in/employment-notices.php",
                "https://rrb.indianrailways.gov.in/"
              ]
            },
            {
              name: "Employment News",
              urls: [
                "https://employmentnews.gov.in/newemp/AllJobs.aspx?k=All"
              ]
            }
          ];

          const file = "Data/jobs.json";

          let jobs = [];

          try {
            jobs = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!Array.isArray(jobs)) jobs = [];
          } catch {
            jobs = [];
          }

          function cleanText(text) {
            return text
              .replace(/<[^>]*>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluteUrl(base, href) {
            try {
              return new URL(href, base).href;
            } catch {
              return null;
            }
          }

          function classify(text) {
            const t = text.toLowerCase();

            if (
              t.includes("admit card") ||
              t.includes("hall ticket") ||
              t.includes("e-call letter")
            ) return "admit_card";

            if (t.includes("answer key")) {
              return "answer_key";
            }

            if (
              t.includes("result") ||
              t.includes("merit list") ||
              t.includes("shortlisted")
            ) return "result";

            return "latest";
          }

          function useful(text, href, source) {
            const t = (text + " " + href).toLowerCase();

            if (source === "Railway") {
              return (
                /ntpc|non[- ]?technical popular categor|cen\s*0[567]\/20\d\d|cen[- ]?0[567]/i.test(t)
              );
            }

            const keywords = [
              "recruit",
              "vacancy",
              "notification",
              "advertisement",
              "advt",
              "application",
              "apply",
              "admit",
              "answer key",
              "result",
              "selection",
              "post",
              "job",
              "career",
              "employment",
              "exam",
              "notice"
            ];

            return keywords.some(k => t.includes(k));
          }

          async function fetchPage(url) {
            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 25000);

              const response = await fetch(url, {
                signal: controller.signal,
                redirect: "follow",
                headers: {
                  "User-Agent":
                    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36",
                  "Accept":
                    "text/html,application/xhtml+xml,application/xml;q=0.9,text/plain;q=0.8,*/*;q=0.7"
                }
              });

              clearTimeout(timer);

              if (!response.ok) {
                console.log("Direct HTTP", response.status, url);
                return null;
              }

              return await response.text();

            } catch (e) {
              console.log("Direct fetch failed:", url, e.message);
              return null;
            }
          }

          async function fetchWithFallback(url) {
            let data = await fetchPage(url);

            if (data) {
              return {
                data,
                mode: "html"
              };
            }

            try {
              const reader =
                "https://r.jina.ai/" + url;

              console.log("Trying fallback reader:", reader);

              const response = await fetch(reader, {
                headers: {
                  "User-Agent": "Mozilla/5.0 GovernmentJobPortal/1.0"
                }
              });

              if (!response.ok) {
                console.log("Fallback HTTP", response.status);
                return null;
              }

              return {
                data: await response.text(),
                mode: "markdown"
              };

            } catch (e) {
              console.log("Fallback failed:", e.message);
              return null;
            }
          }

          function parseHTML(html, sourceUrl, sourceName) {
            const found = [];

            const regex =
              /<a[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;

            let match;

            while ((match = regex.exec(html)) !== null) {
              const href = absoluteUrl(sourceUrl, match[1]);
              if (!href) continue;

              const text = cleanText(match[2]);

              if (text.length < 8) continue;
              if (!useful(text, href, sourceName)) continue;

              found.push({
                title: text.substring(0, 180),
                url: href
              });
            }

            return found;
          }

          function parseMarkdown(markdown, sourceUrl, sourceName) {
            const found = [];

            const regex =
              /\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^)\s]+)\)/gi;

            let match;

            while ((match = regex.exec(markdown)) !== null) {
              const text = cleanText(match[1]);
              const href = absoluteUrl(sourceUrl, match[2]);

              if (!href) continue;
              if (text.length < 8) continue;
              if (!useful(text, href, sourceName)) continue;

              found.push({
                title: text.substring(0, 180),
                url: href
              });
            }

            return found;
          }

          async function fetchSource(source) {
            console.log("Checking:", source.name);

            for (const url of source.urls) {
              const result = await fetchWithFallback(url);

              if (!result) continue;

              let items = [];

              if (result.mode === "html") {
                items = parseHTML(
                  result.data,
                  url,
                  source.name
                );
              } else {
                items = parseMarkdown(
                  result.data,
                  url,
                  source.name
                );
              }

              if (items.length) {
                console.log(
                  source.name,
                  "items:",
                  items.length
                );

                return items;
              }

              console.log(
                source.name,
                "no useful items from:",
                url
              );
            }

            console.log(
              source.name,
              "all sources failed"
            );

            return [];
          }

          async function main() {
            let newJobs = 0;

            for (const source of sources) {
              const items = await fetchSource(source);

              for (const item of items) {
                const id = "auto-" +
                  crypto
                    .createHash("sha1")
                    .update(item.url)
                    .digest("hex")
                    .slice(0, 16);

                const exists = jobs.some(
                  j => j.url === item.url || j.id === id
                );

                if (exists) continue;

                jobs.push({
                  id,
                  title: item.title,
                  url: item.url,
                  type: classify(item.title),
                  source: source.name,
                  status: "pending_verification",
                  verified: false,
                  autoUpdated: true,
                  updatedAt: new Date().toISOString()
                });

                newJobs++;
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(jobs, null, 2)
            );

            console.log("Total jobs:", jobs.length);
            console.log("New jobs:", newJobs);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });

          EOF

      - name: Save updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/jobs.json

          if git diff --cached --quiet; then
            echo "No new government jobs found."
            exit 0
          fi

          git commit -m "Automatic government job update"
          git push
