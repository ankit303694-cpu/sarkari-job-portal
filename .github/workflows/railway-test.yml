name: Railway Browser Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test Railway website
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
            });

            try {
              const url = 'https://www.rrbcdg.gov.in/employment-notices.php';

              console.log('Opening Railway:', url);

              const response = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });

              console.log('HTTP status:', response ? response.status() : 'none');
              console.log('Page title:', await page.title());

              const text = await page.locator('body').innerText();
              console.log('Page text length:', text.length);
              console.log(text.slice(0, 5000));

            } catch (e) {
              console.log('RAILWAY TEST FAILED');
              console.log(e.message);
              process.exitCode = 1;
            }

            await browser.close();
          })();
          EOF
